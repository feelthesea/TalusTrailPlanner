<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talus - Trail Roadbook Generator — 越野跑路书生成器</title>
  <meta name="description" content="Upload a GPX file and create a beautiful trail-race roadbook with elevation profile, checkpoint annotations, and segment statistics.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;900&family=IBM+Plex+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=6.1">
</head>
<body>

  <!-- ═══ Page Header ═══ -->
  <header class="page-header">
    <h1 data-i18n="pageTitle">🏔️ Talus - Trail Roadbook Generator</h1>
    <div style="margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 2px;">
      <span class="subtitle" data-i18n="headerSubtitle" style="margin: 0; font-size: 0.78rem; color: var(--text-muted);">越野跑路书生成器</span>
      <span style="font-size: 0.68rem; color: rgba(255,255,255,0.45); font-weight: 500;"><span data-i18n="vibeCodedBy">Vibe coded by</span> <strong style="color: var(--accent);">Laurent L</strong></span>
    </div>
  </header>

  <!-- ═══ Toolbar ═══ -->
  <div class="toolbar" id="toolbar">
    <!-- GPX upload -->
    <div class="group">
      <button class="btn" id="btn-gpx" title="Upload GPX file">
        <span class="icon">📂</span> <span data-i18n="uploadGpx">上传 GPX</span>
      </button>
      <input type="file" id="input-gpx" accept=".gpx" class="hidden">
    </div>

    <!-- Race name -->
    <div class="group">
      <label class="field-label" for="input-name" data-i18n="raceNameLabel">比赛名称</label>
      <input type="text" id="input-name" class="input-field" placeholder="e.g. UTMB 2026" style="width:160px">
    </div>

    <!-- Race start date/time -->
    <div class="group">
      <label class="field-label" for="input-start-time" data-i18n="raceStartLabel">出发时间</label>
      <select id="input-start-time" class="input-field" style="width:150px"></select>
    </div>

    <div class="sep"></div>

    <!-- JSON import / export -->
    <div class="group">
      <button class="btn" id="btn-import" title="Import checkpoint data from JSON">
        <span class="icon">📥</span> <span data-i18n="importJson">导入 JSON</span>
      </button>
      <input type="file" id="input-json" accept=".json" class="hidden">
      <button class="btn" id="btn-template-json" title="Download JSON configuration template">
        <span class="icon">📋</span> <span data-i18n="downloadTemplate">下载模板</span>
      </button>
      <button class="btn" id="btn-export-json" title="Export checkpoint data as JSON">
        <span class="icon">📤</span> <span data-i18n="exportJson">导出 JSON</span>
      </button>
    </div>

    <div class="sep"></div>

    <!-- Language Selector -->
    <div class="group">
      <label class="field-label" for="select-lang" data-i18n="languageLabel">🌐 语言 / Language</label>
      <select id="select-lang" class="input-field" style="width:100px; height: 32px; padding: 4px 8px; font-size: 0.78rem;">
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
    </div>

    <!-- Image export -->
    <div class="group">
      <label class="field-label" for="export-ratio" data-i18n="exportRatioLabel">导出比例</label>
      <select id="export-ratio" class="input-field" style="width:260px; height: 32px; padding: 4px 8px; font-size: 0.78rem;">
        <option value="auto" data-i18n="ratioAuto">默认自适应 (无白边)</option>
        <option value="19.5-9" data-i18n="ratio19_5_9">19.5:9横屏（iPhone 17/16）</option>
        <option value="20-9" data-i18n="ratio20_9">20:9（小米、华为 Pura、主流安卓）</option>
      </select>
    </div>

    <div class="group">
      <div class="dropdown" id="export-dropdown">
        <button class="btn btn-primary" id="btn-export-img">
          <span class="icon">🖼️</span> <span data-i18n="downloadPng">下载图片 ▾</span>
        </button>
        <div class="dropdown-menu" id="export-menu">
          <button data-scale="1" data-i18n="scale1">1× 标准分辨率</button>
          <button data-scale="2" data-i18n="scale2">2× 高清 (推荐)</button>
          <button data-scale="3" data-i18n="scale3">3× 超高清 (打印)</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ Main Full-Width Stack Layout ═══ -->
  <div class="main-layout">
    <!-- ═══ 1. Profile Viewer (Elevation Chart) & Font Sizes Panel ═══ -->
    <section class="profile-section">
      <div class="profile-main-layout">
        <!-- Left: Elevation Profile SVG -->
        <div class="profile-wrapper" id="profile-container">
          <div class="profile-placeholder" id="profile-placeholder">
            <div class="big-icon">🗻</div>
            <div data-i18n="placeholderText">上传 GPX 文件以生成高程剖面图</div>
            <div style="font-size:0.78rem; color:var(--text-muted);" data-i18n="placeholderTextSub">Upload a GPX file to generate the elevation profile</div>
          </div>
        </div>

        <!-- Right: Font Sizes Sidebar Panel -->
        <aside class="font-sizes-sidebar" id="font-sizes-sidebar">
          <h4 data-i18n="poiCol1FontSizesTitle">各元素字号大小设置 (像素)</h4>
          <div class="poi-font-sizes-grid">
            <div class="poi-field">
              <label data-i18n="fsLabelTitle">比赛名称</label>
              <input type="number" id="fs-title" min="8" max="30" value="18">
            </div>
            <div class="poi-field">
              <label data-i18n="fsLabelCpName">CP点名称</label>
              <input type="number" id="fs-cpname" min="8" max="25" value="14">
            </div>
            <div class="poi-field">
              <label data-i18n="fsLabelCpElev">CP点海拔</label>
              <input type="number" id="fs-cpelev" min="8" max="25" value="11">
            </div>
            <div class="poi-field">
              <label data-i18n="fsLabelCpTime">预计用时</label>
              <input type="number" id="fs-cptime" min="8" max="25" value="20">
            </div>
            <div class="poi-field">
              <label data-i18n="fsLabelCpNotes">备注信息</label>
              <input type="number" id="fs-cpnotes" min="8" max="25" value="18">
            </div>
            <div class="poi-field">
              <label data-i18n="fsLabelSegment">区间分段</label>
              <input type="number" id="fs-segment" min="8" max="25" value="11">
            </div>
            <div class="poi-field" style="grid-column: span 2;">
              <label data-i18n="fsLabelCumulDist">底部累计距离</label>
              <input type="number" id="fs-cumuldist" min="8" max="25" value="12">
            </div>
          </div>
        </aside>
      </div>
    </section>

    <!-- ═══ 2. Two-Column Editor Section (CP List Table + Details Panel) ═══ -->
    <div class="editor-container">
      <!-- Left Column: CP List Table -->
      <section class="editor-left">
        <h2><span data-i18n="cpTableTitle">📍 CP 点 / 补给站 列表</span></h2>
        <div class="cp-table-wrap">
          <table class="cp-table" id="cp-table">
            <thead>
              <tr>
                <th class="col-num" data-i18n="colNum">#</th>
                <th class="col-name" data-i18n="colName">名称</th>
                <th class="col-dist" data-i18n="colDist">距起点 (km)</th>
                <th class="col-time" data-i18n="colTime">抵达cp点总用时</th>
                <th class="col-action"></th>
              </tr>
            </thead>
            <tbody id="cp-tbody">
              <!-- rows injected by app.js -->
            </tbody>
          </table>
          <div class="add-row-bar">
            <button class="btn" id="btn-add-cp">
              <span class="icon">＋</span> <span data-i18n="addCpBtn">添加 CP 点</span>
            </button>
          </div>
        </div>

        <!-- ═══ 3. Summary & Verification Panel (Sisyf style) ═══ -->
        <div class="summary-and-checks">
          <!-- Summary Card -->
          <div class="panel-card summary-card">
            <h3 data-i18n="summaryTitle">📋 计划汇总</h3>
            <div id="summary-content" class="summary-content">
              <!-- Dynamically populated -->
            </div>
          </div>
          
          <!-- Verification Card -->
          <div class="panel-card checks-card">
            <h3 data-i18n="verificationTitle">✓ 计划检查</h3>
            <div id="checks-content" class="checks-content">
              <!-- Dynamically populated -->
            </div>
          </div>

          <!-- Ravito Calculator Card -->
          <div class="panel-card ravito-calc-card">
            <h3 data-i18n="ravitoCalcTitle">📦 补给计算器</h3>
            <div id="ravito-calc-content">
              <!-- Dynamically populated -->
            </div>
          </div>
        </div>
      </section>

      <!-- Right Column: CP Details Customization Panel -->
      <aside class="editor-right poi-panel" id="poi-panel">
        <div class="poi-panel-header-tabs">
          <h3 data-i18n="poiPanelTitle">📍 检查点详细视觉配置</h3>
        </div>

        <div class="poi-content">
          <!-- COLUMN 1: Basic Information -->
          <div class="poi-form-grid-horizontal">
            <h4 data-i18n="poiCol1Title">基本信息</h4>
            
            <div class="poi-field" style="margin-bottom: 6px;">
              <label for="poi-name-detail" data-i18n="colName">名称</label>
              <input type="text" id="poi-name-detail" class="input-field" placeholder="CP点名称">
            </div>

            <div class="poi-field" style="margin-bottom: 6px;">
              <label for="poi-position" data-i18n="poiCol1Pos">CP位置距离 (公里)</label>
              <input type="number" id="poi-position" step="0.1" min="0" value="0">
            </div>

            <div class="poi-field" style="margin-bottom: 6px;">
              <label for="poi-time-detail" data-i18n="colTime">抵达cp点总用时</label>
              <input type="text" id="poi-time-detail" class="input-field" placeholder="抵达用时 H:MM">
            </div>

            <div class="poi-field" style="margin-bottom: 6px;">
              <label for="poi-notes-detail" data-i18n="colNotes">备注 (支持回车多行)</label>
              <textarea id="poi-notes-detail" class="input-field" placeholder="备注信息" style="height: 56px; resize: vertical;"></textarea>
            </div>
            
            <div class="poi-field" style="margin-bottom: 6px;">
              <label for="poi-stop-duration" data-i18n="labelStopDuration">⏸️ 停留时间 (分钟)</label>
              <input type="number" id="poi-stop-duration" min="0" max="120" value="0" step="1">
            </div>

            <div class="poi-form-row inline" style="margin: 6px 0;">
              <input type="checkbox" id="poi-intermediate" class="chk-box">
              <label for="poi-intermediate" data-i18n="poiCol1Intermediate">用于分段统计点 (划分子赛段)</label>
            </div>
          </div>

          <!-- COLUMN 2: CP Type / Icon -->
          <div class="poi-form-grid-horizontal">
            <h4 data-i18n="poiCol2Title">补给站类型</h4>
            <div class="poi-field">
              <label for="poi-icon-select" data-i18n="poiLabelSymbol">类型图标</label>
              <select id="poi-icon-select" class="input-field" style="height: 32px; font-size: 0.82rem;">
                <option value="start" data-i18n="iconStart">🟢 起点</option>
                <option value="finish" data-i18n="iconFinish">🏁 终点</option>
                <option value="assisted" data-i18n="iconAssisted">🤝 有人协助补给站</option>
                <option value="dropbag" data-i18n="iconDropbag">🛍️ 寄存包补给站</option>
                <option value="classic" data-i18n="iconClassic">🍉 普通补给站</option>
                <option value="water" data-i18n="iconWater">💧 水源点</option>
                <option value="checkpoint" data-i18n="iconCheckpoint">🚩 打卡点</option>
                <option value="peak" data-i18n="iconPeak">🏔️ 山峰</option>
                <option value="danger" data-i18n="iconDanger">⚡ 危险</option>
              </select>
            </div>
          </div>

          <!-- COLUMN 3: Axis Configuration -->
          <div class="poi-form-grid-horizontal">
            <h4 data-i18n="poiCol3Title">垂直指示辅助线</h4>
            <div class="poi-field" style="margin-bottom: 6px;">
              <label data-i18n="poiCol3Color">指示线颜色</label>
              <div class="color-picker-wrapper" style="width: 100%;">
                <input type="text" id="poi-axis-color-hex" value="#4e4e4e">
                <input type="color" id="poi-axis-color" value="#4e4e4e">
              </div>
            </div>
            <div class="poi-field">
              <label data-i18n="poiCol3Thickness">指示线粗细 (px)</label>
              <input type="number" id="poi-axis-thickness" value="1" min="1" max="10">
            </div>
          </div>

          <!-- COLUMN 4: Associated Text Annotations -->
          <div class="poi-form-grid-horizontal">
            <h4 data-i18n="poiCol4Title">图表内嵌自定义标注</h4>
            <div class="poi-texts-settings-row" style="grid-template-columns: 1fr 60px 1.2fr; gap: 8px;">
              <div class="poi-field">
                <label data-i18n="poiCol4Color">标注颜色</label>
                <div class="color-picker-wrapper" style="width: 100%;">
                  <input type="text" id="poi-text-color-hex" value="#4e4e4e">
                  <input type="color" id="poi-text-color" value="#4e4e4e">
                </div>
              </div>
              <div class="poi-field">
                <label data-i18n="poiCol4Size">字号 (px)</label>
                <input type="number" id="poi-text-size" value="18" min="6" max="24">
              </div>
              <div class="poi-field">
                <label for="poi-text-orientation" data-i18n="poiCol4Orient">排列方向</label>
                <select id="poi-text-orientation" style="height: 29px; padding: 2px 6px; font-size: 0.74rem;">
                  <option value="To the right" data-i18n="orientRight">靠右横排 (To Right)</option>
                  <option value="To the left" data-i18n="orientLeft">靠左横排 (To Left)</option>
                  <option value="Rotated -90°" data-i18n="orientRotMinus90">靠右竖排 (Rotated -90°)</option>
                  <option value="Rotated 90°" data-i18n="orientRot90">靠左竖排 (Rotated 90°)</option>
                </select>
              </div>
            </div>

            <!-- 2x3 layout for texts -->
            <div class="poi-texts-grid-horizontal">
              <div class="poi-field">
                <label data-i18n="labelLeftBottom">左侧 - 下</label>
                <input type="text" id="poi-txt-left-bottom" data-i18n-placeholder="placeholderTextNone" placeholder="无">
              </div>
              <div class="poi-field">
                <label data-i18n="labelLeftMiddle">左侧 - 中</label>
                <input type="text" id="poi-txt-left-middle" data-i18n-placeholder="placeholderTextNone" placeholder="无">
              </div>
              <div class="poi-field">
                <label data-i18n="labelLeftTop">左侧 - 上</label>
                <input type="text" id="poi-txt-left-top" data-i18n-placeholder="placeholderTextNone" placeholder="无">
              </div>
              <div class="poi-field">
                <label data-i18n="labelRightBottom">右侧 - 下</label>
                <input type="text" id="poi-txt-right-bottom" data-i18n-placeholder="placeholderTextNone" placeholder="无">
              </div>
              <div class="poi-field">
                <label data-i18n="labelRightMiddle">右侧 - 中</label>
                <input type="text" id="poi-txt-right-middle" data-i18n-placeholder="placeholderTextNone" placeholder="无">
              </div>
              <div class="poi-field">
                <label data-i18n="labelRightTop">右侧 - 上</label>
                <input type="text" id="poi-txt-right-top" data-i18n-placeholder="placeholderTextNone" placeholder="无">
              </div>
            </div>
          </div>

          <!-- COLUMN 5: Nutrition Strategy (Sisyf style) -->
          <div class="poi-form-grid-horizontal" style="grid-column: span 2; margin-top: 10px; border-top: 1.5px dashed var(--border-subtle); padding-top: 12px;">
            <h4 data-i18n="poiCol5Title" style="margin-bottom: 8px;">补给计划 (Nutrition Plan)</h4>
            <div class="poi-form-grid-3" style="grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px;">
              <div class="poi-field">
                <label for="poi-water" data-i18n="labelWater">水分补充 (mL/h)</label>
                <select id="poi-water" class="input-field">
                  <option value="0">0 mL/h</option>
                  <option value="100">100 mL/h</option>
                  <option value="150">150 mL/h</option>
                  <option value="200">200 mL/h</option>
                  <option value="250">250 mL/h</option>
                  <option value="300">300 mL/h</option>
                  <option value="350">350 mL/h</option>
                  <option value="400">400 mL/h</option>
                  <option value="450">450 mL/h</option>
                  <option value="500">500 mL/h</option>
                  <option value="550">550 mL/h</option>
                  <option value="600">600 mL/h</option>
                  <option value="650">650 mL/h</option>
                  <option value="700">700 mL/h</option>
                  <option value="750">750 mL/h</option>
                  <option value="800">800 mL/h</option>
                  <option value="850">850 mL/h</option>
                  <option value="900">900 mL/h</option>
                  <option value="950">950 mL/h</option>
                  <option value="1000">1000 mL/h</option>
                </select>
              </div>
              <div class="poi-field">
                <label for="poi-carbs" data-i18n="labelCarbs">碳水化合物 (g/h)</label>
                <select id="poi-carbs" class="input-field">
                  <option value="0">0 g/h</option>
                  <option value="10">10 g/h</option>
                  <option value="20">20 g/h</option>
                  <option value="25">25 g/h</option>
                  <option value="30">30 g/h</option>
                  <option value="35">35 g/h</option>
                  <option value="40">40 g/h</option>
                  <option value="45">45 g/h</option>
                  <option value="50">50 g/h</option>
                  <option value="55">55 g/h</option>
                  <option value="60">60 g/h</option>
                  <option value="65">65 g/h</option>
                  <option value="70">70 g/h</option>
                  <option value="75">75 g/h</option>
                  <option value="80">80 g/h</option>
                  <option value="85">85 g/h</option>
                  <option value="90">90 g/h</option>
                  <option value="95">95 g/h</option>
                  <option value="100">100 g/h</option>
                  <option value="105">105 g/h</option>
                  <option value="110">110 g/h</option>
                  <option value="115">115 g/h</option>
                  <option value="120">120 g/h</option>
                </select>
              </div>
              <div class="poi-field">
                <label for="poi-sodium" data-i18n="labelSodium">钠补充 (mg/L)</label>
                <select id="poi-sodium" class="input-field">
                  <option value="0">0 mg/L</option>
                  <option value="100">100 mg/L</option>
                  <option value="200">200 mg/L</option>
                  <option value="300">300 mg/L</option>
                  <option value="400">400 mg/L</option>
                  <option value="500">500 mg/L</option>
                  <option value="600">600 mg/L</option>
                  <option value="700">700 mg/L</option>
                  <option value="800">800 mg/L</option>
                  <option value="900">900 mg/L</option>
                  <option value="1000">1000 mg/L</option>
                  <option value="1100">1100 mg/L</option>
                  <option value="1200">1200 mg/L</option>
                </select>
              </div>
              <div class="poi-field">
                <label for="poi-caffeine" data-i18n="labelCaffeine">咖啡因 (mg)</label>
                <select id="poi-caffeine" class="input-field">
                  <option value="0">0 mg</option>
                  <option value="20">20 mg</option>
                  <option value="40">40 mg</option>
                  <option value="50">50 mg</option>
                  <option value="80">80 mg</option>
                  <option value="100">100 mg</option>
                  <option value="150">150 mg</option>
                  <option value="200">200 mg</option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <!-- ═══ Toast ═══ -->
  <div class="toast" id="toast"></div>

  <!-- ═══ Scripts (order matters: utils first) ═══ -->
  <script src="js/utils.js?v=6.1"></script>
  <script src="js/gpx-parser.js?v=6.1"></script>
  <script src="js/profile.js?v=6.1"></script>
  <script src="js/export.js?v=6.1"></script>
  <script src="js/app.js?v=6.1"></script>
</body>
</html>
